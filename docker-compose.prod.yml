version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ops-integration-backend
    ports:
      - "9090:8001"
    environment:
      - CORS_ORIGINS=*
    extra_hosts:
      - "proxy.local:host-gateway"
    restart: unless-stopped
    volumes:
      - ./ops_integration_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ops-integration-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:9090
    depends_on:
      - backend
    restart: unless-stopped
