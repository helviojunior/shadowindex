version: '3.8'

# Lightweight docker-compose for development/testing
# Uses SOAP mock server instead of real SOAP services
# Does not include Tika (OCR)

services:
  soap-mock:
    build:
      context: ./backend/soap_mock
      dockerfile: Dockerfile
    container_name: ops-integration-soap-mock-dev
    ports:
      - "9999:9999"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ops-integration-backend-dev
    ports:
      - "9090:8001"
    volumes:
      - ./shadowindex_data:/app/data
    environment:
      - CORS_ORIGINS=*
      - SOAP_MOCK_URL=http://soap-mock:9999/Test.asmx
    extra_hosts:
      - "proxy.local:host-gateway"
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    depends_on:
      - soap-mock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ops-integration-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:9090
    depends_on:
      - backend
    restart: unless-stopped
