version: '3.8'

services:
  tika:
    image: apache/tika:latest-full
    container_name: ops-integration-tika-dev
    restart: unless-stopped
    # No port exposure - internal only

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ops-integration-backend-dev
    ports:
      - "9090:8001"
    volumes:
      - ./backend:/app
      - ./ops_integration_data:/app/data
    environment:
      - CORS_ORIGINS=*
      - TIKA_SERVER_URL=http://tika:9998
    extra_hosts:
      - "proxy.local:host-gateway"
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    depends_on:
      - tika

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ops-integration-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:9090
    depends_on:
      - backend
    command: yarn start
    restart: unless-stopped
