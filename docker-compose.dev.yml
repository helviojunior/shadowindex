version: '3.8'

# Docker-compose for development/testing
# Includes SOAP mock server and Tika for OCR

services:
  tika:
    image: apache/tika:latest-full
    container_name: shadowindex-tika-dev
    restart: unless-stopped
    environment:
      - TIKA_TASK_TIMEOUT_MILLIS=900000
      - TIKA_TASK_PULSE_MILLIS=1200000
    command: >
      java -jar /tika-server-standard.jar
      --host 0.0.0.0
      --port 9998
      --taskTimeoutMillis 900000
      --taskPulseMillis 1200000

  soap-mock:
    build:
      context: ./backend/soap_mock
      dockerfile: Dockerfile
    container_name: shadowindex-soap-mock-dev
    ports:
      - "9999:9999"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowindex-backend-dev
    ports:
      - "9090:8001"
    volumes:
      - ./shadowindex_data:/app/data
    environment:
      - CORS_ORIGINS=*
      - TIKA_SERVER_URL=http://tika:9998
      - SOAP_MOCK_URL=http://soap-mock:9999/Test.asmx
    extra_hosts:
      - "proxy.local:host-gateway"
      - "tika:shadowindex-tika-dev"
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    depends_on:
      - tika
      - soap-mock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shadowindex-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:9090
    depends_on:
      - backend
    restart: unless-stopped
