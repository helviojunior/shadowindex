# Docker-compose for development/testing
# Includes SOAP mock server, Tika for OCR, and PostgreSQL

services:
  postgres:
    image: postgres:16-alpine
    container_name: shadowindex-postgres-dev
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
      POSTGRES_USER: shadowindex
      POSTGRES_PASSWORD: shadowindex
      POSTGRES_DB: shadowindex
    volumes:
      # Bind-mount no host (compartilhado com docker-compose.yml — não rode os dois juntos).
      - ./shadowindex_data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowindex -d shadowindex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shadowindex-net

  tika:
    image: apache/tika:latest-full
    container_name: shadowindex-tika-dev
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9998/tika >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - shadowindex-net

  soap-mock:
    build:
      context: ./backend/soap_mock
      dockerfile: Dockerfile
    container_name: shadowindex-soap-mock-dev
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
    ports:
      - "9999:9999"
    networks:
      - shadowindex-net

  opensearch-init:
    image: busybox:1.36
    container_name: shadowindex-opensearch-init-dev
    command: ["sh", "-c", "mkdir -p /data && chown -R 1000:1000 /data"]
    volumes:
      - ./shadowindex_data/opensearch:/data
    networks:
      - shadowindex-net

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: shadowindex-opensearch-dev
    restart: unless-stopped
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    environment:
      TZ: "America/Sao_Paulo"
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # Bind-mount no host; ownership ajustado pelo serviço opensearch-init.
      - ./shadowindex_data/opensearch:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shadowindex-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowindex-backend-dev
    restart: unless-stopped
    ports:
      - "9090:8001"
    extra_hosts:
      - "proxy.local:host-gateway"
    volumes:
      - ./shadowindex_data:/app/data
    environment:
      TZ: "America/Sao_Paulo"
      CORS_ORIGINS: "*"
      TIKA_SERVER_URL: "http://tika:9998"
      OPENSEARCH_URL: "http://opensearch:9200"
      SOAP_MOCK_URL: "http://soap-mock:9999/Test.asmx"
      # PostgreSQL - Comentar para usar SQLite
      POSTGRES_URL: "postgresql://shadowindex:shadowindex@postgres:5432/shadowindex"
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      soap-mock:
        condition: service_started
    networks:
      - shadowindex-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL:-http://localhost:9090}"
    container_name: shadowindex-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: "America/Sao_Paulo"
      # Variável também em runtime (para yarn start)
      REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL:-http://localhost:9090}"
    depends_on:
      - backend
    networks:
      - shadowindex-net

networks:
  shadowindex-net:
    driver: bridge
