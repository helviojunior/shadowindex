version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shadowindex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shadowindex
      POSTGRES_PASSWORD: shadowindex
      POSTGRES_DB: shadowindex
    volumes:
      - ./shadowindex_data/postgres_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowindex -d shadowindex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shadowindex-net

  tika:
    image: apache/tika:latest-full
    container_name: shadowindex-tika
    restart: unless-stopped
    volumes:
      - ./tika-config.xml:/tika-config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9998/tika >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - shadowindex-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowindex-backend
    restart: unless-stopped
    ports:
      - "9090:8001"
    volumes:
      - ./shadowindex_data:/app/data
    environment:
      CORS_ORIGINS: "*"
      TIKA_SERVER_URL: "http://tika:9998"
      # PostgreSQL - Comentar para usar SQLite
      POSTGRES_URL: "postgresql://shadowindex:shadowindex@postgres:5432/shadowindex"
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy
    networks:
      - shadowindex-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL:-http://localhost:9090}"
    container_name: shadowindex-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Variável também em runtime (para yarn start)
      REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL:-http://localhost:9090}"
    depends_on:
      - backend
    networks:
      - shadowindex-net

networks:
  shadowindex-net:
    driver: bridge
