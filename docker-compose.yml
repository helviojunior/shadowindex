version: '3.8'

networks:
  shadowindex-net:
    driver: bridge

services:
  tika:
    image: apache/tika:latest-full
    container_name: shadowindex-tika
    restart: unless-stopped
    volumes:
      - ./tika-config.xml:/tika-config.xml:ro
    environment:
      # Configuração via variáveis de ambiente
      - TIKA_TASK_TIMEOUT_MILLIS=900000
      - TIKA_TASK_PULSE_MILLIS=1200000
    # Usar configuração customizada com timeout de 15 minutos
    command: >
      java -jar /tika-server-standard.jar
      --host 0.0.0.0
      --port 9998
      --taskTimeoutMillis 900000
      --taskPulseMillis 1200000
    networks:
      - shadowindex-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowindex-backend
    ports:
      - "9090:8001"
    volumes:
      - ./shadowindex_data:/app/data
    environment:
      - CORS_ORIGINS=*
      - TIKA_SERVER_URL=http://tika:9998
    extra_hosts:
      - "proxy.local:host-gateway"
    command: uvicorn server:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    depends_on:
      - tika
    networks:
      - shadowindex-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shadowindex-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:9090
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - shadowindex-net
