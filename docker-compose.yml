services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-shadowindex}-postgres
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
      POSTGRES_USER: shadowindex
      POSTGRES_PASSWORD: shadowindex
      POSTGRES_DB: shadowindex
      # PGDATA aponta para um SUBdiretório do bind-mount. O check de ownership do
      # Postgres recai sobre esse subdir (criado dentro do container, dono correto),
      # o que faz o bind-mount funcionar tanto no Linux quanto no Docker Desktop
      # macOS/Windows (onde o mount raiz teria "wrong ownership" via virtiofs).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Bind-mount no host (dados ficam em ./shadowindex_data/postgres/pgdata).
      - ./shadowindex_data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowindex -d shadowindex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shadowindex-net

  tika:
    image: apache/tika:latest-full
    container_name: ${COMPOSE_PROJECT_NAME:-shadowindex}-tika
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
    volumes:
      - ./tika-config.xml:/tika-config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9998/tika >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - shadowindex-net

  # Prepara o host p/ o OpenSearch (roda uma vez e sai; o opensearch espera):
  #  1) vm.max_map_count>=262144 (bootstrap check obrigatório no Linux) — precisa
  #     de privileged p/ escrever o sysctl do host; '|| true' não quebra no macOS;
  #  2) ownership do bind-mount p/ uid 1000 (o opensearch não faz chown sozinho).
  opensearch-init:
    image: busybox:1.36
    container_name: ${COMPOSE_PROJECT_NAME:-shadowindex}-opensearch-init
    privileged: true
    command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true; mkdir -p /data && chown -R 1000:1000 /data"]
    volumes:
      - ./shadowindex_data/opensearch:/data
    networks:
      - shadowindex-net

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: ${COMPOSE_PROJECT_NAME:-shadowindex}-opensearch
    restart: unless-stopped
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    environment:
      TZ: "America/Sao_Paulo"
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # memory_lock desligado: evita o bootstrap check de memlock (que falha em
      # hosts sem ulimit de memlock). Trade-off de perf desprezível p/ single-node.
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # Bind-mount no host. O ownership é ajustado pelo serviço opensearch-init.
      - ./shadowindex_data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shadowindex-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-shadowindex}-backend
    restart: unless-stopped
    extra_hosts:
      - "proxy.local:host-gateway"
    volumes:
      - ./shadowindex_data:/app/data
    environment:
      TZ: "America/Sao_Paulo"
      CORS_ORIGINS: "*"
      TIKA_SERVER_URL: "http://tika:9998"
      OPENSEARCH_URL: "http://opensearch:9200"
      # PostgreSQL - Comentar para usar SQLite
      POSTGRES_URL: "postgresql://shadowindex:shadowindex@postgres:5432/shadowindex"
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - shadowindex-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ""
    container_name: ${COMPOSE_PROJECT_NAME:-shadowindex}-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      TZ: "America/Sao_Paulo"
    depends_on:
      - backend
    networks:
      - shadowindex-net

networks:
  shadowindex-net:
    driver: bridge
