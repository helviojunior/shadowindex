version: '3.8'

services:
  tika:
    image: apache/tika:latest-full
    container_name: ops-integration-tika
    restart: unless-stopped
    # No port exposure - internal only

  soap-mock:
    build:
      context: ./backend/soap_mock
      dockerfile: Dockerfile
    container_name: ops-integration-soap-mock
    ports:
      - "9999:9999"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ops-integration-backend
    ports:
      - "9090:8001"
    volumes:
      - ./shadowindex_data:/app/data
    environment:
      - CORS_ORIGINS=*
      - TIKA_SERVER_URL=http://tika:9998
      - SOAP_MOCK_URL=http://soap-mock:9999/Test.asmx
    extra_hosts:
      - "proxy.local:host-gateway"
    command: uvicorn server:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    depends_on:
      - tika
      - soap-mock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ops-integration-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:9090
    depends_on:
      - backend
    restart: unless-stopped

