services:
  postgres:
    image: postgres:16-alpine
    container_name: shadowindex-postgres
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
      POSTGRES_USER: shadowindex
      POSTGRES_PASSWORD: shadowindex
      POSTGRES_DB: shadowindex
    volumes:
      # Bind-mount no host. O entrypoint oficial do Postgres ajusta o ownership
      # do PGDATA durante o init, então não precisa de chown prévio.
      - ./shadowindex_data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowindex -d shadowindex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shadowindex-net

  tika:
    image: apache/tika:latest-full
    container_name: shadowindex-tika
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
    volumes:
      - ./tika-config.xml:/tika-config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9998/tika >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - shadowindex-net

  # Ajusta o ownership do bind-mount do OpenSearch (roda como uid 1000 e não faz
  # chown do data dir). Roda uma vez e sai; o opensearch espera sua conclusão.
  opensearch-init:
    image: busybox:1.36
    container_name: shadowindex-opensearch-init
    command: ["sh", "-c", "mkdir -p /data && chown -R 1000:1000 /data"]
    volumes:
      - ./shadowindex_data/opensearch:/data
    networks:
      - shadowindex-net

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: shadowindex-opensearch
    restart: unless-stopped
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    environment:
      TZ: "America/Sao_Paulo"
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # Bind-mount no host. O ownership é ajustado pelo serviço opensearch-init.
      - ./shadowindex_data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shadowindex-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowindex-backend
    restart: unless-stopped
    extra_hosts:
      - "proxy.local:host-gateway"
    volumes:
      - ./shadowindex_data:/app/data
    environment:
      TZ: "America/Sao_Paulo"
      CORS_ORIGINS: "*"
      TIKA_SERVER_URL: "http://tika:9998"
      OPENSEARCH_URL: "http://opensearch:9200"
      # PostgreSQL - Comentar para usar SQLite
      POSTGRES_URL: "postgresql://shadowindex:shadowindex@postgres:5432/shadowindex"
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - shadowindex-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ""
    container_name: shadowindex-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      TZ: "America/Sao_Paulo"
    depends_on:
      - backend
    networks:
      - shadowindex-net

networks:
  shadowindex-net:
    driver: bridge
